apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docuquery-ingress
  namespace: docuquery-ai
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "docuquery-service"
spec:
  ingressClassName: nginx
  rules:
  - host: docuquery.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docuquery-service
            port:
              number: 80
